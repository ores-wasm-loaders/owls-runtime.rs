name: native contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check out the admitted interface source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ores-wasm-loaders/owls-interfaces
          ref: f8fc1873c1b402c04f67dbf62f89b3691ba300fe
          path: zed_modules/ores-wasm-loaders/owls-interfaces
          persist-credentials: false

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy

      - name: Record toolchain
        run: |
          set -euo pipefail
          rustc +1.94.0 --version --verbose
          cargo +1.94.0 --version

      - name: Check formatting
        run: cargo +1.94.0 fmt --all -- --check

      - name: Reject warnings and unsafe target drift
        run: cargo +1.94.0 clippy --locked --all-targets --all-features -- -D warnings

      - name: Run native contract and package-receipt tests
        run: cargo +1.94.0 test --locked --all-features
