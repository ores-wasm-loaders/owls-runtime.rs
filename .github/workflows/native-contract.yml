name: native contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check out the admitted interface source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ores-wasm-loaders/owls-interfaces
          ref: d036d73c35ced08f028c402407c667c339df79e6
          path: zed_modules/ores-wasm-loaders/owls-interfaces
          persist-credentials: false

      - name: Record toolchain
        run: |
          set -euo pipefail
          rustc --version --verbose
          cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Reject warnings and unsafe target drift
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run native contract and package-receipt tests
        run: cargo test --locked --all-features
