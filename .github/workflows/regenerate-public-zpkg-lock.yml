name: Regenerate portable Zed lock

on:
  push:
    branches:
      - DEN-378-regenerate-public-lock

permissions:
  contents: write

concurrency:
  group: regenerate-owls-runtime-public-lock
  cancel-in-progress: false

env:
  ZED_CLI_SHA: f3123ebebadaede30da97a31a586288c3b15609d
  CANONICAL_REGISTRY: https://registry.zpkg.net
  DEAD_REGISTRY: https://zed-control-plane-intentionally-unavailable.invalid
  EXPECTED_SHA256: fea1f81d31f220bc2c4bdb548546b52e4d7c929e12b64b590143fe75b184ae75
  EXPECTED_COMMIT: 291406191b55606e34b7980b42112e9c77ab690b
  EXPECTED_TAG: v0.1.1
  ZED_PKG_SOURCE_FALLBACK: 'true'
  ZED_PKG_R2_PUBLIC_BASE: http://127.0.0.1:1

jobs:
  regenerate-and-certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out lock consumer branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: DEN-378-regenerate-public-lock
          fetch-depth: 0
          persist-credentials: true

      - name: Check out exact zed-cli candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_SHA }}
          path: product/zed-cli
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.98.1'

      - name: Build exact candidate
        working-directory: product/zed-cli
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$ZED_CLI_SHA"
          cargo build --locked --release --bin zed

      - name: Regenerate lock without ambient file registry
        shell: bash
        run: |
          set -Eeuo pipefail
          ZED="$GITHUB_WORKSPACE/product/zed-cli/target/release/zed"
          unset GITHUB_TOKEN GH_TOKEN ZED_PKG_GITHUB_TOKEN || true
          rm -rf .zpkg.lock zed_modules "$RUNNER_TEMP/zed-home-regenerate"
          "$ZED" --registry "$CANONICAL_REGISTRY" --home "$RUNNER_TEMP/zed-home-regenerate" install \
            --install-mode copy --adapter none --allow-ecosystem-mismatch \
            2>&1 | tee "$RUNNER_TEMP/regenerate.log"

          test -s .zpkg.lock
          ! grep -Fq 'file://' .zpkg.lock
          grep -Fq "sha256 = \"$EXPECTED_SHA256\"" .zpkg.lock
          grep -Fq "vcs_tag = \"$EXPECTED_TAG\"" .zpkg.lock
          grep -Fq "vcs_commit = \"$EXPECTED_COMMIT\"" .zpkg.lock
          grep -Fq 'https://github.com/ores-wasm-loaders/owls-interfaces' .zpkg.lock
          grep -Fq "$CANONICAL_REGISTRY" .zpkg.lock

      - name: Prove frozen restore survives dead control plane from empty home
        shell: bash
        run: |
          set -Eeuo pipefail
          ZED="$GITHUB_WORKSPACE/product/zed-cli/target/release/zed"
          unset GITHUB_TOKEN GH_TOKEN ZED_PKG_GITHUB_TOKEN || true
          cp .zpkg.lock "$RUNNER_TEMP/regenerated.lock"
          rm -rf zed_modules "$RUNNER_TEMP/zed-home-frozen"
          "$ZED" --registry "$DEAD_REGISTRY" --home "$RUNNER_TEMP/zed-home-frozen" install --frozen \
            --install-mode copy --adapter none --allow-ecosystem-mismatch \
            2>&1 | tee "$RUNNER_TEMP/frozen.log"
          cmp "$RUNNER_TEMP/regenerated.lock" .zpkg.lock
          test "$(find zed_modules -name .zpkg.toml -type f | wc -l | tr -d ' ')" -ge 1

      - name: Commit only the generated portable lock
        shell: bash
        run: |
          set -Eeuo pipefail
          git checkout -- . ':!.zpkg.lock' ':!.github/workflows/regenerate-public-zpkg-lock.yml' || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .zpkg.lock
          if git diff --cached --quiet; then
            echo 'Generated lock already matches the branch.'
            exit 0
          fi
          git commit -m 'chore: regenerate portable zpkg lock from public source'
          git push origin HEAD:DEN-378-regenerate-public-lock

      - name: Retain sanitized lock evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owls-runtime-public-lock-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            .zpkg.lock
            ${{ runner.temp }}/regenerated.lock
            ${{ runner.temp }}/regenerate.log
            ${{ runner.temp }}/frozen.log
