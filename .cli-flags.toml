# Repository-level CLI/env contract for governance tooling.
# owls-runtime.rs is a library package and exposes no user-facing application
# argv surface; the command below is the repository-owned validation entrypoint.
# Keep dotenv loading disabled rather than inventing ambient runtime variables.

[help]
url = "https://github.com/ores-wasm-loaders/owls-runtime.rs"
columns = ["options", "env", "type", "default", "description"]

[env]
files = []

[parse]
command_env = "OWLS_RUNTIME_GOVERNANCE_COMMAND"
unknown_options_env = "OWLS_RUNTIME_UNKNOWN_OPTIONS"
errors_env = "OWLS_RUNTIME_PARSE_ERRORS"
allow_unknown = false

[commands.env-contract]
help = "Validate the repository CLI/environment inventory and fail closed on drift."
env = "OWLS_RUNTIME_ENV_CONTRACT"

